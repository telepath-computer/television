<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
    <title>Television</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      .drag-region {
        height: 36px;
        flex-shrink: 0;
        -webkit-app-region: drag;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 360px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 11px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      input {
        background: transparent;
        border: 1px solid #2a2a2a;
        color: #fff;
        padding: 10px 12px;
        font-size: 14px;
        font-family: inherit;
        border-radius: 6px;
        outline: none;
        transition: border-color 120ms;
      }
      input:focus {
        border-color: #fff;
      }
      input:disabled {
        opacity: 0.6;
        border-color: #2a2a2a;
      }
      button {
        margin-top: 6px;
        background: #fff;
        color: #000;
        border: none;
        padding: 0 16px;
        font-size: 14px;
        font-weight: 500;
        font-family: inherit;
        border-radius: 6px;
        cursor: default;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 40px;
        box-sizing: border-box;
      }
      button:disabled:not([data-connecting="true"]) {
        opacity: 0.5;
      }
      button[data-connecting="true"] {
        opacity: 0.85;
      }
      .button-label {
        line-height: 1;
      }
      .button-spinner {
        position: absolute;
        left: 16px;
        top: 0;
        bottom: 0;
        width: 14px;
        height: 14px;
        margin-block: auto;
        box-sizing: border-box;
        border: 2px solid rgba(0, 0, 0, 0.2);
        border-top-color: #000;
        border-radius: 50%;
        visibility: hidden;
        animation: connect-spin 0.7s linear infinite;
      }
      button[data-connecting="true"] .button-spinner {
        visibility: visible;
      }
      @keyframes connect-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .error {
        color: #ff6b6b;
        font-size: 12px;
        line-height: 18px;
        height: 36px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="drag-region" data-drag-region></div>
    <main>
      <form id="connect-form">
        <label>
          Server URL
          <input id="serverURL" type="text" placeholder="https://example.com" required autofocus />
        </label>
        <label>
          Token <span style="text-transform: none; letter-spacing: 0; color: #555;">(leave blank for no-auth servers)</span>
          <input id="token" type="password" />
        </label>
        <div class="error" id="error"></div>
        <button type="submit" id="submit">
          <span class="button-spinner" aria-hidden="true"></span>
          <span class="button-label">Connect</span>
        </button>
      </form>
    </main>
    <script src="connect-page.cjs"></script>
  </body>
</html>
