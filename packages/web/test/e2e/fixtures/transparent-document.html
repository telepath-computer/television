<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Transparent document</title>
    <style>
      html, body { margin: 0; background: transparent; }
      button { margin: 32px; }
    </style>
  </head>
  <body>
    <button onclick="this.textContent = 'Activated'">Activate</button>
  </body>
</html>
