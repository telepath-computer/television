<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document</title>
  <link rel="stylesheet" href="/canonical/v2/styles.css?authoredForAppVersion=1.5.4">
  <link rel="stylesheet" href="./editor.css">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="/canonical/v2/components.js"></script>
</head>
<body>
  <main class="document-page" data-state="loading">
    <div id="editor" hidden></div>
    <div class="document-loading" role="status">
      <tv-icon name="spinner" size="lg"></tv-icon>
      <span>Loading document…</span>
    </div>
    <div class="document-unreadable" role="alert" hidden>
      <tv-icon name="warning" size="xl"></tv-icon>
      <h1>This document can't be shown</h1>
      <p>Its saved data isn't in the form this page reads. Ask your agent to check it.</p>
    </div>
    <p class="document-status" role="status"></p>
  </main>
  <script src="./editor.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
