<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Example</title>
<link rel="stylesheet" href="/canonical/v2/styles.css?authoredForAppVersion=1.5.4">
<style>
  body { padding: var(--space-32, 32px); }
  main { max-width: 40rem; }
  #message { font-size: var(--text-2xl, 24px); }
</style>
</head>
<body>
<main text-display="prose">
  <h1>Example</h1>
  <p id="message" role="status"></p>
</main>
<script type="module">
  import { getStore, onValue, ref } from "/sdk/v1/resources.js";
  onValue(ref(getStore()), (snapshot) => {
    const value = snapshot.val();
    document.querySelector("#message").textContent = typeof value?.message === "string" ? value.message : "";
  });
</script>
</body>
</html>
