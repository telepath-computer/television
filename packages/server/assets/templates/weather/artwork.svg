<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 224">
  <!-- Original first-party drawings. Symbols are composed by the Weather page. -->
  <defs>
    <g id="sun"><circle cx="78" cy="70" r="25" fill="#ffd45c"/><path d="M78 24v14M78 102v14M32 70h14M110 70h14M45 37l10 10M101 93l10 10M111 37l-10 10M55 93l-10 10" fill="none" stroke="#ffd45c" stroke-width="8" stroke-linecap="round"/></g>
    <g id="moon"><path d="M99 35c-28 5-42 38-25 60 9 12 25 17 40 12-10 13-28 19-45 12-25-10-36-39-24-63 10-20 33-30 54-21Z" fill="#fff4c4"/></g>
    <g id="cloud"><path d="M58 147c-21 0-38-15-38-35 0-19 15-34 34-35 7-25 30-42 57-42 31 0 57 23 60 53 18 3 31 17 31 35 0 20-17 36-38 36H58Z" fill="#2a5e8d" opacity=".24"/><path d="M55 140c-18 0-32-13-32-29 0-17 14-29 31-29h6c6-24 27-40 52-40 29 0 52 21 55 48h2c17 0 30 12 30 28 0 17-14 30-32 30H55Z" fill="#f8fbff"/></g>
    <g id="clear-day"><circle cx="112" cy="100" r="42" fill="#ffd45c"/><path d="M112 26v22M112 152v22M38 100h22M164 100h22M60 48l16 16M148 136l16 16M164 48l-16 16M76 136l-16 16" fill="none" stroke="#ffd45c" stroke-width="10" stroke-linecap="round"/></g>
    <g id="clear-night"><path d="M150 45c-40 8-59 54-35 85 14 19 38 25 59 17-15 21-43 29-68 18-35-15-49-55-31-88 14-27 46-41 75-32Z" fill="#fff4c4"/><circle cx="56" cy="58" r="3" fill="#fff"/><circle cx="164" cy="72" r="2.5" fill="#fff"/></g>
    <g id="partly-cloudy-day"><use href="#sun"/><use href="#cloud"/></g>
    <g id="partly-cloudy-night"><use href="#moon"/><use href="#cloud"/></g>
    <g id="cloudy"><use href="#cloud" transform="translate(-20 -12) scale(.9)" opacity=".72"/><use href="#cloud"/></g>
    <g id="rain"><use href="#cloud"/><path d="M65 165l-8 18M105 165l-8 18M145 165l-8 18M181 163l-7 16" fill="none" stroke="#b9e6ff" stroke-width="8" stroke-linecap="round"/></g>
    <g id="snow"><use href="#cloud"/><path d="M62 166v22M51 177h22M54 169l16 16M70 169l-16 16M115 166v22M104 177h22M107 169l16 16M123 169l-16 16M168 166v22M157 177h22M160 169l16 16M176 169l-16 16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g>
    <g id="thunderstorm"><use href="#cloud"/><path d="M112 151h29l-22 28h18l-40 39 12-30H91l21-37Z" fill="#ffd45c"/></g>
    <g id="fog"><use href="#cloud"/><path d="M31 154h150M48 174h143M27 194h118" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".82"/></g>
  </defs>
