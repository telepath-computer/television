<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sticky note</title>
  <link rel="stylesheet" href="/canonical/v2/styles.css?authoredForAppVersion=1.5.4">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="sticky-note-page">
    <section class="sticky-note">
      <p class="sticky-note-status" role="status"></p>
    </section>
  </main>
  <template id="sticky-note-content">
    <textarea class="sticky-note-text" aria-label="Note" spellcheck="false"></textarea>
  </template>

      <h1 class="sticky-note-unreadable-title">This note can't be shown</h1>
      <p class="sticky-note-unreadable-text">Its saved data isn't in the form this page reads. Ask your agent to check it.</p>
    </div>
  </template>
  <script type="module" src="./page.js"></script>
</body>
</html>
