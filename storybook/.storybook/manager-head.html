<!--
  Storybook 10.6 shows its "What's new" dot on the settings button even with
  core.disableWhatsNewNotifications set: the manager reads the setting from the
  wrong place. Hide the dot until that is fixed upstream.
-->
<style>
  button[aria-label="Settings"]::before,
  button[aria-label="Settings"]::after {
    display: none;
  }

  /* Start the sidebar at the search field: no logo row. The settings menu goes
     with it; its keyboard shortcuts still work. */
  /* Storybook's own styles load after this file, so these need !important. */
  .sidebar-header {
    display: none !important;
  }

  .sidebar-item,
  .sidebar-item * {
    font-size: 13px !important;
  }
</style>
