<!doctype html>
<meta charset="utf-8" />
<title>blank frame</title>
<!--
  A pre-configured document a story renders into: blank — nothing booted, no
  styles, an empty custom-element registry. Frames that need the design system
  or a surface implementation load them here as ordinary module scripts.
-->
<style>
  html,
  body {
    height: 100%;
  }

  body {
    margin: 0;
  }
</style>
